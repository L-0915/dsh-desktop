<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .box { text-align: center; max-width: 460px; padding: 0 24px; }
      .logo {
        font-size: 56px;
        margin-bottom: 16px;
        animation: pulse 1.6s ease-in-out infinite;
      }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
      p { font-size: 14px; color: #94a3b8; margin: 0; }
      #errorMsg { color: #f87171; margin-bottom: 12px; white-space: pre-line; }
      #retryBtn {
        margin-top: 16px;
        padding: 8px 24px;
        font-size: 14px;
        font-weight: 600;
        color: #0f172a;
        background: #38bdf8;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      #retryBtn:hover { background: #7dd3fc; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="logo">🐳</div>
      <h1>DeepSeek Harness</h1>
      <div id="loading">
        <p>正在启动服务，请稍候…</p>
      </div>
      <div id="error" hidden>
        <p id="errorMsg">服务启动失败</p>
        <p>请点击下方按钮重试。</p>
        <button id="retryBtn" type="button">重试</button>
      </div>
      <div id="exitAsk" hidden>
        <p>服务仍在后台运行。</p>
        <p>「退出」将同时停止服务，「仅关闭窗口」则保留服务。</p>
        <button id="exitBtn" type="button">退出</button>
        <button id="closeOnlyBtn" type="button">仅关闭窗口</button>
      </div>
    </div>
    <script>
      window.__dshShowLoading = function () {
        document.getElementById('loading').hidden = false;
        document.getElementById('error').hidden = true;
        document.getElementById('exitAsk').hidden = true;
      };
      window.__dshShowError = function (message) {
        if (typeof message === 'string' && message !== '') {
          document.getElementById('errorMsg').textContent = message;
        }
        document.getElementById('loading').hidden = true;
        document.getElementById('error').hidden = false;
        document.getElementById('exitAsk').hidden = true;
      };
      window.__dshAskExit = function () {
        document.getElementById('exitAsk').hidden = false;
      };
      document.getElementById('retryBtn').addEventListener('click', function () {
        if (window.__TAURI__ && typeof window.__TAURI__.invoke === 'function') {
          window.__TAURI__.invoke('retry_start').catch(function () {});
        }
      });
      document.getElementById('exitBtn').addEventListener('click', function () {
        if (window.__TAURI__ && typeof window.__TAURI__.invoke === 'function') {
          window.__TAURI__.invoke('exit_app').catch(function () {});
        }
      });
      document.getElementById('closeOnlyBtn').addEventListener('click', function () {
        if (window.__TAURI__ && typeof window.__TAURI__.invoke === 'function') {
          window.__TAURI__.invoke('close_window').catch(function () {});
        }
      });
    </script>
  </body>
</html>
