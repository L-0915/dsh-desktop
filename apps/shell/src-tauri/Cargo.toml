[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DSH Desktop Launcher shell — standalone window for the DeepSeek Harness Web GUI"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
