name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: dsh-desktop-windows-x64
          # macOS lands once a maintainer with a Mac validates the .app flow.
          # - os: macos-latest
          #   artifact: dsh-desktop-macos-aarch64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm build:plugin

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri shell
        run: |
          cd apps/shell/src-tauri
          cargo build --release

      - name: Package shell into the plugin (exe + WebView2Loader.dll)
        run: node scripts/copy-shell.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/shell/src-tauri/target/release/dsh-desktop.exe
            apps/shell/src-tauri/target/release/WebView2Loader.dll
            apps/shell/src-tauri/target/release/bundle/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
