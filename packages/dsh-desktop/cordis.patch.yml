# dsh-desktop bundle patch: inserts the dual-face plugin row into the web
# profile roster. The row is a bare plugin by package name: the node half
# (exports ".") runs in the host process (shortcut/icon/config API), and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client") load in the web GUI.
- insert:
    - id: desktop
      name: '@debb74/dsh-desktop'
